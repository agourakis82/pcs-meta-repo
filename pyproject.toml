[project]
name = "pcs_toolbox"
version = "0.2.1"
description = "Tools for the PCS project"
authors = [{name = "Demetrios Agourakis", email = "demetrios@agourakis.med.br"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2.1",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "pandas>=2.2.2",
    "matplotlib>=3.8.4",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=23.2.0",
    "httpx>=0.25.0",
    "chromadb>=0.4.0",
    "openai>=1.0.0",
  "slowapi>=0.1.9",
  "sentence-transformers>=2.7.0",
  "python-dotenv>=1.0.0",
  # Vertex AI optional (guarded by env DARWIN_USE_VERTEX)
  "google-cloud-aiplatform>=1.66.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"
known_first_party = ["pcs_toolbox"]
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = false
