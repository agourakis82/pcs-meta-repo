name: pcs-meta-repo
channels:
- conda-forge
- nvidia
dependencies:
- python=3.11
- pip>=24.2
- numpy=1.26.4
- pandas=2.2.2
- scipy=1.13.0
- matplotlib=3.8.4
- networkx=3.2.1
- statsmodels=0.14.2
- joblib=1.3.2
- pyarrow>=12
- pip:
  - typer==0.12.3
  - rich==13.7.1
  - pyyaml>=6.0
  - opencc>=1.1.6
  - python-louvain>=0.16
  - ruff==0.5.7
  - black==24.8.0
  - isort==5.13.2
  - pytest==8.3.2
  - nbstripout==0.7.1
  - jupytext
  - nbformat
  - nbclient
  - nbconvert
  - pytest-nbmake
- openpyxl>=3.1.2
- cupy-cuda12x>=13.0.0 # optional, if CUDA 12.x available
- nvidia-cublas-cu12
- nvidia-cusparse-cu12
- nvidia-cuda-runtime-cu12
- nvidia-cuda-nvrtc-cu12
- nvidia-cuda-cupti-cu12
- nvidia-nvtx-cu12

# For cuGraph/cuDF (GPU coherence) prefer mamba:
#   mamba install -c rapidsai -c conda-forge cugraph cudf python=3.11 cuda-version=12.0
