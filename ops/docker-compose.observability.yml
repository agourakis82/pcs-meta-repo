# Setup Instructions:
# 1. Create observability directory structure:
#    mkdir -p ops/observability/{grafana/{provisioning,dashboards},rules}
#
# 2. Copy configuration files to observability/ directory
#
# 3. Enable nginx status endpoint:
#    Add to nginx config: location /nginx_status { stub_status; allow 127.0.0.1; deny all; }
#
# 4. Start the stack:
#    docker-compose -f docker-compose.observability.yml up -d
#
# 5. Access dashboards:
#    - Grafana: http://localhost:3000 (admin/changeme123)
#    - Prometheus: http://localhost:9090
#    - AlertManager: http://localhost:9093
#
# 6. Import Grafana dashboards:
#    - Node Exporter Full: ID 1860
#    - Nginx: ID 12900
#    - Custom PCS dashboard (create based on metrics)

# SLO Definitions:
# - Website Response Time: p95 < 500ms
# - API Response Time: p95 < 1000ms
# - SSE Connection Success Rate: > 99.5%
# - System Uptime: > 99.9%
# - Tunnel Connectivity: > 99.8%
