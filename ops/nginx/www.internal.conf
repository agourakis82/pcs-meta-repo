# Nginx Virtual Host - Website (www.agourakis.med.br)
# Internal HTTP server on 127.0.0.1:8440
# Serves static website with apex redirect functionality

# === CONFIGURATION VARIABLES ===
# ORG_DOMAIN="agourakis.med.br"
# WWW_HOST="www.agourakis.med.br"
# WWW_PORT=8440
# NGINX_USER="www-data"

server {
    listen 127.0.0.1:8440;
    server_name www.agourakis.med.br agourakis.med.br;
    
    # Logging configuration
    access_log /var/log/nginx/www-access.log combined;
    error_log /var/log/nginx/www-error.log warn;
    
    # Root directory for static website
    root /var/www/pcs-meta-repo;
    index index.html index.htm;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline'" always;
    add_header X-Robots-Tag "index, follow" always;
    
    # APEX DOMAIN REDIRECT (SEO best practice)
    # Redirect agourakis.med.br -> www.agourakis.med.br
    if ($host = 'agourakis.med.br') {
        return 301 https://www.agourakis.med.br$request_uri;
    }
    
    # Main website location
    location / {
        try_files $uri $uri/ @fallback;
        
        # Cache control for HTML pages
        location ~* \.html?$ {
            add_header Cache-Control "public, max-age=300" always;
            expires 5m;
        }
    }
    
    # Static assets with aggressive caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        
        # Enable gzip for static assets
        gzip_static on;
        gzip_vary on;
        
        # Optional: Add CORS for fonts
        location ~* \.(woff|woff2|ttf|eot)$ {
            add_header Access-Control-Allow-Origin "*" always;
        }
    }
    
    # SPA fallback (optional - uncomment if needed)
    location @fallback {
        try_files /index.html =404;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK - Website\n";
        add_header Content-Type text/plain always;
    }
    
    # Favicon handling
    location /favicon.ico {
        log_not_found off;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    
    # Robots.txt
    location /robots.txt {
        log_not_found off;
        access_log off;
        expires 1d;
        add_header Cache-Control "public" always;
    }
    
    # Block common vulnerability scanners
    location ~* /\.(env|git|svn|htaccess|htpasswd) {
        deny all;
        return 404;
    }
    
    # Block PHP and other script execution attempts
    location ~* \.(php|asp|aspx|jsp)$ {
        deny all;
        return 404;
    }
    
    # Prevent access to sensitive directories
    location ~* /(admin|wp-admin|wp-login|phpmyadmin) {
        deny all;
        return 404;
    }
}

# Additional server block for handling www-less requests with custom log
server {
    listen 127.0.0.1:8440;
    server_name agourakis.med.br;
    
    # Separate logging for apex domain requests
    access_log /var/log/nginx/apex-redirect.log combined;
    error_log /var/log/nginx/apex-redirect-error.log warn;
    
    # Permanent redirect to www
    return 301 https://www.agourakis.med.br$request_uri;
}