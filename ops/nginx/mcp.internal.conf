# Nginx Virtual Host - MCP API & SSE (mcp.agourakis.med.br)
# Internal HTTP server on 127.0.0.1:8480
# Reverse proxy to FastAPI/Uvicorn with SSE optimization

# === CONFIGURATION VARIABLES ===
# MCP_HOST="mcp.agourakis.med.br"
# MCP_PORT=8480
# BACKEND_PORT=8000
# NGINX_USER="www-data"

# Upstream definition for FastAPI backend
upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

server {
    listen 127.0.0.1:8480;
    server_name mcp.agourakis.med.br;
    
    # Logging configuration with detailed format
    log_format mcp_combined '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           '$request_time $upstream_response_time '
                           '$upstream_status "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/mcp-access.log mcp_combined;
    error_log /var/log/nginx/mcp-error.log warn;
    
    # Global proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    
    # Timeouts for regular API calls
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # CORS headers for API endpoints
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, mcp-session-id, mcp-protocol-version" always;
    add_header Access-Control-Expose-Headers "mcp-session-id, mcp-protocol-version" always;
    add_header Access-Control-Max-Age "3600" always;
    
    # CORS preflight handling
    location ~ ^/mcp {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, mcp-session-id, mcp-protocol-version" always;
            add_header Access-Control-Max-Age "3600" always;
            add_header Content-Type "text/plain charset=UTF-8" always;
            add_header Content-Length "0" always;
            return 204;
        }
        
        # Proxy to FastAPI backend
        proxy_pass http://fastapi_backend;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # SSE endpoint with specialized configuration
    location ~ ^/sse/ {
        # SSE-specific proxy settings
        proxy_pass http://fastapi_backend;
        
        # Critical SSE settings
        proxy_buffering off;                    # Disable nginx buffering
        proxy_cache off;                       # Disable caching
        proxy_http_version 1.1;               # Required for keep-alive
        proxy_set_header Connection "";        # Clear connection header
        
        # SSE Headers
        add_header Cache-Control "no-cache" always;
        add_header Content-Type "text/event-stream" always;
        add_header X-Accel-Buffering "no" always;  # Disable nginx buffering
        
        # Extended timeouts for long-lived connections
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;             # 1 hour
        proxy_read_timeout 3600s;             # 1 hour
        
        # Keep-alive settings
        proxy_set_header Connection "keep-alive";
        proxy_set_header Upgrade $http_upgrade;
        
        # CORS for SSE
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Prevent rate limiting on SSE
        limit_req off;
        limit_conn off;
    }
    
    # General API endpoints (non-MCP specific)
    location / {
        proxy_pass http://fastapi_backend;
        
        # Standard API response caching
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://fastapi_backend/health;
        proxy_cache_bypass 1;
        
        # Quick health check timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    # OpenAPI/Swagger documentation
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://fastapi_backend;
        
        # Cache documentation for a short time
        add_header Cache-Control "public, max-age=300" always;
        expires 5m;
    }
    
    # ChatGPT Actions schema endpoint
    location ~ ^/actions/schema {
        proxy_pass http://fastapi_backend;
        
        # Cache schema for a short time
        add_header Cache-Control "public, max-age=300" always;
        expires 5m;
        
        # Ensure CORS for ChatGPT
        add_header Access-Control-Allow-Origin "*" always;
    }
    
    # WebSocket upgrade support (if needed)
    location /ws {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache off;
        
        # WebSocket timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    
    # Security: Block sensitive endpoints
    location ~ /\.(env|git|svn) {
        deny all;
        return 404;
    }
    
    # Rate limiting for API endpoints (excluding SSE)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req zone=api burst=20 nodelay;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 10;
}

# Error page configuration
error_page 404 /404.html;
error_page 500 502 503 504 /50x.html;

location = /404.html {
    return 404 '{"error": "Not Found", "status": 404}\n';
    add_header Content-Type application/json always;
}

location = /50x.html {
    return 500 '{"error": "Internal Server Error", "status": 500}\n';
    add_header Content-Type application/json always;
}