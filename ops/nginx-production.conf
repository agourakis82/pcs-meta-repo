# Configuração nginx para www.agourakis.med.br
server {
    listen 8080;
    server_name www.agourakis.med.br agourakis.med.br;
    
    # Logs estruturados
    access_log /var/log/nginx/agourakis-access.log;
    error_log /var/log/nginx/agourakis-error.log;
    
    # Redirect apex → www (SEO best practice)
    if ($host = 'agourakis.med.br') {
        return 301 https://www.agourakis.med.br$request_uri;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    # Site principal
    location / {
        root /var/www/pcs-meta-repo;
        index index.html index.htm;
        try_files $uri $uri/ =404;
        
        # Cache estático
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "OK - Website";
        add_header Content-Type text/plain;
    }
}

# Configuração nginx para mcp.agourakis.med.br
server {
    listen 8081;
    server_name mcp.agourakis.med.br;
    
    # Logs separados para API
    access_log /var/log/nginx/mcp-access.log;
    error_log /var/log/nginx/mcp-error.log;
    
    # Proxy para uvicorn FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts para SSE/long polling
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        
        # Headers para CORS (ChatGPT Actions)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
    
    # Health check específico para MCP
    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}