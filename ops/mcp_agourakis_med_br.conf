## Nginx site: mcp.agourakis.med.br (reverse proxy to FastAPI on 127.0.0.1:8000)

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name mcp.agourakis.med.br;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.agourakis.med.br;

    # TLS (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/mcp.agourakis.med.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.agourakis.med.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS for ChatGPT/Browser
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, mcp-session-id, mcp-protocol-version, MCP-Session-Id, MCP-Protocol-Version" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, mcp-session-id" always;

    # Preflight handling
    if ($request_method = OPTIONS) { return 204; }

    # Default proxy to app
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # MCP SSE/JSON-RPC endpoint
    location /mcp {
        proxy_pass http://127.0.0.1:8000/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Connection "";
        proxy_buffering off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Trailing slash variant to avoid 307 redirects with POST
    location /mcp/ {
        proxy_pass http://127.0.0.1:8000/mcp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Connection "";
        proxy_buffering off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SSE alias expected by ChatGPT Connectors (/sse/)
    location /sse/ {
        proxy_pass http://127.0.0.1:8000/mcp/sse/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Connection "";
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Handle /sse without trailing slash
    location = /sse {
        return 308 /sse/;
    }

    # Explicit routes (optional but useful)
    location = /.well-known/ai-plugin.json { proxy_pass http://127.0.0.1:8000/.well-known/ai-plugin.json; }
    location = /actions/schema            { proxy_pass http://127.0.0.1:8000/actions/schema; }
    location = /openapi.json              { proxy_pass http://127.0.0.1:8000/openapi.json; }
    location = /health                    { proxy_pass http://127.0.0.1:8000/health; }
    location = /docs                      { proxy_pass http://127.0.0.1:8000/docs; }

    access_log /var/log/nginx/mcp.agourakis.med.br.access.log;
    error_log  /var/log/nginx/mcp.agourakis.med.br.error.log;
}
