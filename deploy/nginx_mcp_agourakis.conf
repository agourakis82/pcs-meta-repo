# Nginx reverse proxy for RAG++ API + MCP (ChatGPT Connector)
# Domain: mcp.agourakis.med.br

server {
    listen 80;
    server_name mcp.agourakis.med.br;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.agourakis.med.br;

    # Managed by certbot after issuance
    ssl_certificate     /etc/letsencrypt/live/mcp.agourakis.med.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.agourakis.med.br/privkey.pem;

    # Proxy to local FastAPI (uvicorn) at 127.0.0.1:8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE and MCP streaming friendliness
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        # CORS (ChatGPT domains)
        add_header Access-Control-Allow-Origin "https://chat.openai.com" always;
        add_header Access-Control-Allow-Origin "https://chatgpt.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, mcp-session-id, mcp-protocol-version, last-event-id" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}

