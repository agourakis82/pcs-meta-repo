# nginx/sites-available/mcp.conf
# Configuração Nginx para MCP API via Cloudflare Tunnel (loopback apenas)
#
# IMPORTANTE: 
# - O Cloudflare termina TLS; Nginx atende só em loopback
# - Não configure SSL/TLS neste vhost
# - Para ativar: sudo ln -s /path/to/this/file /etc/nginx/sites-enabled/
#
# Cloudflare Tunnel → mcp.agourakis.med.br → 127.0.0.1:8081 → Nginx → 127.0.0.1:8000 (Uvicorn)

server {
    listen 127.0.0.1:8081;                 # apenas loopback
    server_name mcp.agourakis.med.br;

    # Headers de proxy comuns
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;  # Cloudflare já terminou TLS

    # Timeouts para requisições longas
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    # MCP HTTP (JSON) - endpoints principais
    location /mcp {
        # Pré-flight CORS (ajuste Origin para produção, se necessário)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age "3600";
            return 204;
        }
        
        # Headers CORS para requests reais
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "mcp-session-id, mcp-protocol-version" always;

        proxy_pass http://127.0.0.1:8000;  # Uvicorn MCP
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE (Server-Sent Events) - stream para atualizações em tempo real
    location /sse/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Configurações específicas para SSE
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache";
        
        # Timeouts longos para streams
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        
        # CORS para SSE
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Health check e endpoints de status
    location /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;  # Não logar health checks
    }

    location /test {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # Search endpoint (RAG++ queries)
    location /search {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;  # Timeout mais curto para buscas
        proxy_send_timeout 30s;
        
        # CORS para search
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Default fallback → MCP raiz (catchall)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Logs específicos para debug
    access_log /var/log/nginx/mcp_access.log;
    error_log /var/log/nginx/mcp_error.log;
}