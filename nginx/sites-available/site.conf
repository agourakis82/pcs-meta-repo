# nginx/sites-available/site.conf
# Configuração Nginx para website principal via Cloudflare Tunnel (loopback apenas)
#
# IMPORTANTE: 
# - O Cloudflare termina TLS; Nginx atende só em loopback
# - Não configure SSL/TLS neste vhost
# - Para ativar: sudo ln -s /path/to/this/file /etc/nginx/sites-enabled/
#
# Cloudflare Tunnel → agourakis.med.br → 127.0.0.1:8080 → Nginx → /var/www/site

server {
    listen 127.0.0.1:8080;
    server_name agourakis.med.br;

    # Diretório raiz do website estático
    root /var/www/site;
    index index.html index.htm;

    # Configurações de segurança básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # Servir arquivos estáticos
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache para assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fallback para SPAs (se necessário no futuro)
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup/config files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logs
    access_log /var/log/nginx/site_access.log;
    error_log /var/log/nginx/site_error.log;
}

# Opcional: redirect de www para non-www (se necessário)
