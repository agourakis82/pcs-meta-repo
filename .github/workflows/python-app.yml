name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install minimal deps for CI
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install numpy pandas scipy matplotlib networkx statsmodels joblib pytest ruff black typer rich python-igraph scikit-learn

      - name: Lint
        run: |
          ruff check src tests
          black --check src tests

      - name: Run tests
        run: pytest -q

      - name: Build placeholder figures
        run: |
          python -m pcs.figures main --out figures/main --report-dir reports
          test -f figures/main/F1_mean_spike_delta_kec_en.png

