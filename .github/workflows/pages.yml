name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          if [ -d docs ]; then cp -r docs site/docs; fi
          if [ -d reports ]; then cp -r reports site/reports; fi
          if [ -d figures ]; then cp -r figures site/figures; fi
          echo "<html><body><h1>PCS Meta-Repo</h1><ul><li><a href=\"reports/Results_Summary.md\">Results Summary</a></li><li><a href=\"figures/\">Figures</a></li><li><a href=\"docs/\">Docs</a></li></ul></body></html>" > site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

