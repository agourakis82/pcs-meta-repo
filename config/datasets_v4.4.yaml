# External datasets configuration v4.4 - Modality Separation
# This file defines the structure and metadata for all external datasets used in the project

# SWOW multilingual (existing)
swow:
  languages: [ "en", "es", "nl", "zh" ]
  raw_dir: "@data_root.raw_public/swow"
  tidy_dir: "@data_root.L1_tidy/swow"
  derived_dir: "@data_root.L2_derived/kec"
  expected_files: [ "**/*.csv", "**/*.tsv" ]
  redistribution: "no-redistribution; cite source"

# RT / ET datasets (Reading Time / Eye-Tracking)
datasets_rt:
  # ZuCo Reading Time component
  zuco_rt:
    name: "ZuCo RT - Reading Time Component"
    raw_dir: "@data_root.raw_zuco_v1"
    processed_dir: "@data_root.L1_tidy/zuco_rt"
    modality: "eye-tracking"
    language: [ "en" ]
    expected_files: [ "**/*.mat", "**/*.csv", "**/*.tsv" ]
    citation: "Hollenstein et al. (2018, 2020)"
    license: "research-only; OSF/ZuCo terms"
    redistribution: "no-redistribution"
    processing_status: "ready_for_v4.4"
    subjects_count: 12
    metrics_available: [ "FFD", "GD", "TRT" ]

  # GECO Eye-tracking
  geco_et:
    name: "GECO - Ghent Eye-tracking Corpus"
    raw_dir: "@data_root.raw_external/geco"
    processed_dir: "@data_root.L1_tidy/geco_rt"
    modality: "eye-tracking"
    language: [ "en", "nl" ]
    expected_files: [ "**/*.txt", "**/*.csv", "**/*.tsv", "**/*.zip" ]
    citation: "Cop et al. (2017)"
    license: "public; see GECO site"
    doi_or_osf: "https://expsy.ugent.be/downloads/geco/"
    redistribution: "no-redistribution; cite source"
    processing_status: "completed"
    priority: "medium"

  # OneStop Eye-tracking
  onestop_et:
    name: "OneStop - English Reading Corpus"
    raw_dir: "@data_root.raw_external/onestop"
    processed_dir: "@data_root.L1_tidy/onestop_rt"
    modality: "eye-tracking"
    language: [ "en" ]
    expected_files: [ "**/*.csv", "**/*.tsv", "**/*.parquet", "**/*.zip" ]
    citation: "LaCC Lab"
    license: "CC BY 4.0 / project site"
    doi_or_osf: "https://lacclab.github.io/OneStop-Eye-Movements/"
    redistribution: "no-redistribution; cite source"
    processing_status: "completed"
    priority: "medium"

# EEG datasets
datasets_eeg:
  # ZuCo EEG component
  zuco_eeg:
    name: "ZuCo EEG - EEG Component"
    raw_dir: "@data_root.raw_zuco_v1"
    processed_dir: "@data_root.L1_tidy/zuco_eeg"
    modality: "EEG"
    language: [ "en" ]
    expected_files: [ "**/*.mat", "**/*.csv", "**/*.tsv" ]
    citation: "Hollenstein et al. (2018, 2020)"
    license: "research-only; OSF/ZuCo terms"
    redistribution: "no-redistribution"
    processing_status: "ready_for_v4.4"
    subjects_count: 12
    metrics_available: [ "theta_power", "alpha_power", "beta_power", "gamma_power" ]

  # DERCo EEG
  derco_eeg:
    name: "DERCo - Dutch Reading Corpus EEG"
    raw_dir: "@data_root.raw_external/derco"
    processed_dir: "@data_root.L1_tidy/derco_eeg"
    modality: "EEG"
    language: [ "en" ]
    expected_files: [ "**/*.fif", "**/*.csv", "**/*.tsv" ]
    citation: "Frank & Aumeistere (2024)"
    license: "CC BY 4.0 (OSF)"
    doi_or_osf: "https://www.nature.com/articles/s41597-024-03915-8"
    redistribution: "no-redistribution; cite source"
    processing_status: "completed"
    priority: "high"

  # LPP EEG
  lpp_eeg:
    name: "LPP - Le Petit Prince EEG"
    raw_dir: "@data_root.raw_external/lpp"
    processed_dir: "@data_root.L1_tidy/lpp_eeg"
    modality: "EEG"
    language: [ "en" ]
    expected_files: [ "**/*.fif", "**/*.csv", "**/*.tsv" ]
    citation: "Nastase et al. (2021)"
    license: "OpenNeuro; see dataset terms"
    doi_or_osf: "https://openneuro.org/datasets/ds005345"
    redistribution: "no-redistribution; cite source"
    processing_status: "completed"
    priority: "high"
    notes: "May require sentence-level aggregation if not word-aligned"

# Processing configuration v4.4
processing:
  chunk_size: 10000
  memory_limit: "8GB"
  parallel_jobs: 4
  validation_enabled: true
  modality_separation: true

# Schema validation v4.4
schemas:
  word_events_rt:
    required_columns: [ "lang", "subject_id", "task_id", "doc_id", "sent_id", "word_id", "word", "ffd_ms", "gd_ms", "trt_ms", "nfix", "length", "logfreq", "position" ]
    optional_columns: [ "cloze_prob", "surprisal", "frequency" ]
    validation_rules:
      ffd_ms: { min: 50, max: 800, unit: "milliseconds" }
      gd_ms: { min: 50, max: 1200, unit: "milliseconds" }
      trt_ms: { min: 80, max: 1200, unit: "milliseconds" }
      nfix: { min: 1, max: 20 }

  word_events_eeg:
    required_columns: [ "lang", "subject_id", "task_id", "doc_id", "sent_id", "word_id", "word", "eeg_metric", "theta", "alpha", "beta", "onset_ms", "offset_ms", "length", "logfreq", "position" ]
    optional_columns: [ "gamma", "delta", "unit_level" ]
    validation_rules:
      theta: { min: -10, max: 10, unit: "microvolts" }
      alpha: { min: -10, max: 10, unit: "microvolts" }
      beta: { min: -10, max: 10, unit: "microvolts" }
      onset_ms: { min: 0, max: 10000, unit: "milliseconds" }

# Integration paths v4.4
integration:
  output_dir: "@data_root.processed/v4.4/integration"
  rt_files:
  - "zuco_kec_rt.parquet"
  - "geco_kec_rt.parquet"
  - "onestop_kec_rt.parquet"
  eeg_files:
  - "zuco_kec_eeg.parquet"
  - "derco_kec_eeg.parquet"
  - "lpp_kec_eeg.parquet"
  compatibility:
  - "zuco_kec_merged.parquet" # backward compatibility

# Quality gates v4.4
quality_gates:
  acceptance_criteria:
    rt_datasets:
      min_records: 5000
      required_subjects: 2
      required_metrics: [ "ffd_ms", "gd_ms", "trt_ms" ]
    eeg_datasets:
      min_records: 1000
      required_subjects: 1
      required_metrics: [ "theta", "alpha", "beta" ]
    kec_integration:
      min_coverage: 0.7 # 70% of tokens must have KEC metrics
      required_languages: [ "en" ]

  validation_steps:
  - "schema_validation"
  - "range_validation"
  - "duplicate_detection"
  - "missing_pattern_analysis"
  - "kec_join_validation"

# Backward compatibility
legacy_support:
  maintain_files:
  - "data/processed/integrated_neuro_swow.csv" # keep for compatibility
  deprecated_paths:
  - "data/processed/zuco" # replaced by zuco_rt + zuco_eeg
  migration_notes: "Use datasets_rt and datasets_eeg sections for v4.4+ processing"
