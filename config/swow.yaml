seed: 42
device: "cuda" # Force CUDA usage for GPU acceleration
languages: [ "en", "es", "nl", "zh" ]
alias_map: { "rp": "es", "pt-br": "es", "pt-pt": "es" }
paths:
  raw_dir: "data/raw_public/swow"
  derived_dir: "data/L2_derived/kec"
  logs: "reports/kec"
params:
  entropy:
    smoothing: "teleport" # "selfloop" | "teleport"
    epsilon: 1e-6
  curvature:
    method: "forman" # "forman" | "ollivier" (ollivier only for QC sample)
    orc_sample_frac: 0.02
  coherence:
    method: "neighbor_cosine_topk"
    top_k: 20
  embeddings:
    method: "spectral" # Changed from "node2vec" to "spectral" for GPU acceleration
    dim: 128
    walk_len: 80
    walks_per_node: 20
    p: 1.0
    q: 1.0
  communities:
    method_gpu: "louvain" # cuGraph Louvain if GPU
    method_cpu: "leiden" # igraph+leidenalg (fallback to louvain if missing)
  compose:
    weights: { K: 0.3333, E: 0.3333, C: 0.3334 }
    zscore: true
qc:
  compute_scc_flag: true
  store_comp_id: true
