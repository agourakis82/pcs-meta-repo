    processed_dir: "data/L1_tidy/derco_eeg"
    modality: "EEG"
    language: [ "en" ]
    expected_files: [ "**/*.fif", "**/*.csv", "**/*.tsv" ]
  lpp_eeg:
    raw_dir: "data/raw_public/lpp"
    processed_dir: "data/L1_tidy/lpp_eeg"
    modality: "EEG"
    language: [ "en" ]
    expected_files: [ "**/*.fif", "**/*.csv", "**/*.tsv" ]
