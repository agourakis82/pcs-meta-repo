# PCS-Meta-Repo v4.4 Dataset Configuration
# Updated to use real data paths and hierarchical structure

# SWOW Dataset Configuration
swow:
  languages: [ "en", "es", "nl", "zh" ]
  raw_dir: "data/raw_public/swow"
  tidy_dir: "data/L1_tidy/swow"
  derived_dir: "data/L2_derived/kec"
  expected_files: [ "**/*.csv", "**/*.tsv" ]
  redistribution: "no-redistribution; cite source"

# RT/ET Datasets (Reading Times & Eye-Tracking)
datasets_rt:
  zuco_rt:
    raw_dir: "data/raw_public/zuco"
    processed_dir: "data/L1_tidy/zuco_rt"
    modality: "eye-tracking"
    language: [ "en" ]
    expected_files: [ "**/*.mat", "**/*.csv", "**/*.tsv" ]
  geco_et:
    raw_dir: "data/raw_public/geco"
    processed_dir: "data/L1_tidy/geco_et"
    modality: "eye-tracking"
    language: [ "en", "nl" ]
    expected_files: [ "**/*.txt", "**/*.csv", "**/*.tsv", "**/*.zip" ]
  onestop_et:
    raw_dir: "data/raw_public/onestop"
    processed_dir: "data/L1_tidy/onestop_et"
    modality: "eye-tracking"
    language: [ "en" ]
    expected_files: [ "**/*.csv", "**/*.tsv", "**/*.parquet", "**/*.zip" ]
  excel_custom_rt:
    raw_dir: "data/raw_public/excel_custom"
    processed_dir: "data/L1_tidy/excel_custom_rt"
    modality: "eye-tracking"
    language: [ "en" ]
    expected_files: [ "**/*.xlsx" ]

# EEG Datasets  
datasets_eeg:
  zuco_eeg:
    raw_dir: "data/raw_public/zuco"
    processed_dir: "data/L1_tidy/zuco_eeg"
